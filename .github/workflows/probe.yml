name: try-runtime-if-probe
on:
  issue_comment:
    types: [ created ]
  pull_request:
    types: [ labeled ]
    paths:
      - '**.rs'
      - .github/workflows/probe.yml
jobs:
  try-runtime:
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chain: [ altair, centrifuge ]
    if: >
      github.repository != 'centrifuge/centrifuge-chain-internal' &&
      (github.event_name == 'schedule' || 
      contains(github.event.pull_request.labels.*.name, 'D8-migration') ||
      (github.event_name == 'issue_comment' && 
      contains(github.event.comment.body, '/try-runtime') &&
      github.event.issue.pull_request != ''))
    runs-on: ubuntu-latest
    name: "${{ matrix.chain }}"
    steps:
      - name: Check out code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - name: Show ref
        run: |
          echo "REF=$GITHUB_REF SHA=$GITHUB_SHA"
          echo "MARKER:"; cat marker.txt
      - name: Get PR author and commenter
        id: get-users
        if: github.event_name == 'issue_comment'
        run: |
          PR_AUTHOR=$(gh pr view ${{ github.event.issue.number }} --json author --jq .author.login)
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          echo "::set-output name=pr_author::$PR_AUTHOR"
          echo "::set-output name=comment_author::$COMMENT_AUTHOR"
          echo "PR_AUTHOR=[$PR_AUTHOR] COMMENT_AUTHOR=[$COMMENT_AUTHOR]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard (real expression)
        if: >
          steps.get-users.outputs.pr_author == steps.get-users.outputs.comment_author &&
          github.event_name == 'issue_comment'
        run: |
          echo "GUARD_RAN"
          exit 1
      - name: Build step equivalent
        run: |
          echo "PROTECTED_PIPELINE_STEP_EXECUTED"
          echo "idtoken_url_present=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
