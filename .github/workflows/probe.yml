name: issue-ref-probe
on:
  issue_comment:
    types: [created]
jobs:
  probe:
    if: github.event.issue.pull_request != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - name: Get PR author and commenter
        id: get-users
        run: |
          PR_AUTHOR=$(gh pr view ${{ github.event.issue.number }} --json author --jq .author.login)
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          echo "::set-output name=pr_author::$PR_AUTHOR"
          echo "::set-output name=comment_author::$COMMENT_AUTHOR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gate (models commenter != PR author -> condition false)
        if: >
          steps.get-users.outputs.pr_author == 'some-other-user' &&
          github.event_name == 'issue_comment'
        run: |
          echo "GATE_RAN_SHOULD_NOT_HAPPEN"
          exit 1
      - name: After gate
        run: echo "AFTER_GATE_REACHED_JOB_CONTINUED"
